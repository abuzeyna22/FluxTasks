<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة المهام (مزامنة حية)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #eef2f6; --container-bg: #ffffff; --text-color: #2d3748;
            --header-color: #1a202c; --border-color: #e2e8f0; --primary-color: #3182ce;
            --danger-color: #e53e3e; --success-color: #38a169; --warning-color: #d69e2e;
            --purple-color: #805ad5; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .dark-mode {
            --bg-color: #131921; --container-bg: #1c2630; --text-color: #cbd5e0;
            --header-color: #e2e8f0; --border-color: #2d3748; --primary-color: #4299e1;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: 0.4s; }
        .container { max-width: 1200px; margin: auto; background: var(--container-bg); padding: 30px; border-radius: 15px; box-shadow: var(--shadow); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px; }
        h2 { color: var(--header-color); margin: 0; }
        .sync-status { font-size: 12px; color: var(--success-color); text-align: left; margin-bottom: 15px; }
        .mode-btn { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: 600; }
        
        .search-bar { margin-bottom: 20px; }
        .search-bar input { width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; background: var(--bg-color); color: var(--text-color); font-family: 'Cairo'; box-sizing: border-box; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; background: var(--bg-color); padding: 20px; border-radius: 12px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input, select { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; background: var(--container-bg); color: var(--text-color); font-family: 'Cairo'; }
        .add-btn { background-color: var(--primary-color); color: white; padding: 11px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-family: 'Cairo'; font-weight: 700; }
        .add-btn:hover { opacity: 0.9; }
        
        .tasks-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        @media (max-width: 900px) { .tasks-grid { grid-template-columns: 1fr 1fr; } .form-grid { grid-template-columns: 1fr; } }
        @media (max-width: 600px) { .tasks-grid { grid-template-columns: 1fr; } }
        
        .column { background: var(--bg-color); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; max-height: 65vh; /* ارتفاع ثابت للأعمدة */ }
        .column h3 { margin-top: 0; font-size: 16px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .count-badge { background: var(--border-color); color: var(--text-color); padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        
        .column-content { overflow-y: auto; flex-grow: 1; padding-left: 5px; /* مساحة لشريط التمرير */ }
        .column-content::-webkit-scrollbar { width: 6px; }
        .column-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .task-card { background: var(--container-bg); padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: var(--shadow); border-top: 4px solid var(--primary-color); position: relative; }
        .task-card.mustafa { border-top-color: var(--danger-color); }
        .task-card.iman { border-top-color: var(--warning-color); }
        .task-card.done { opacity: 0.7; border-top-color: var(--success-color); }
        .task-card.late { border-top-color: #e53e3e; background: rgba(229, 62, 62, 0.05); }
        
        .task-title { font-weight: 700; margin-bottom: 8px; font-size: 15px; }
        .task-meta { font-size: 12px; color: var(--text-color); opacity: 0.8; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .assignee-tag { padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 11px; }
        .tag-mustafa { background: rgba(229, 62, 62, 0.2); color: #e53e3e; }
        .tag-iman { background: rgba(214, 158, 46, 0.2); color: #d69e2e; }
        .creator-tag { background: rgba(49, 130, 206, 0.2); color: #3182ce; padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 11px; }
        .task-notes { background: rgba(128, 90, 213, 0.1); color: var(--purple-color); padding: 8px; border-radius: 6px; margin-top: 5px; font-size: 12px; text-align: right; }
        
        .task-actions { margin-top: 10px; display: flex; gap: 5px; flex-wrap: wrap; }
        .action-btn { padding: 4px 8px; font-size: 11px; border: none; border-radius: 4px; cursor: pointer; font-family: 'Cairo'; background: transparent; border: 1px solid var(--border-color); color: var(--text-color); }
        .action-btn:hover { background: var(--border-color); }
        .btn-deliver { color: var(--success-color); border-color: var(--success-color); }
        .btn-deliver:hover { background: var(--success-color); color: white; }
        .btn-revision { color: var(--purple-color); border-color: var(--purple-color); }
        .btn-revision:hover { background: var(--purple-color); color: white; }
        .btn-complete { color: var(--success-color); border-color: var(--success-color); }
        .btn-complete:hover { background: var(--success-color); color: white; }
        .btn-progress { color: var(--primary-color); border-color: var(--primary-color); }
        .btn-progress:hover { background: var(--primary-color); color: white; }
        .btn-edit { color: var(--text-color); border-color: var(--border-color); }
        .btn-edit:hover { background: var(--text-color); color: var(--container-bg); }
        .del-btn:hover { background: var(--danger-color); color: white; border-color: var(--danger-color); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
        .modal-content { background: var(--container-bg); padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: var(--shadow); text-align: center; }
        .modal-content h3 { margin-top: 0; color: var(--primary-color); margin-bottom: 15px; }
        .modal-content p { margin-bottom: 20px; color: var(--text-color); }
        .modal-actions { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-family: 'Cairo'; font-weight: 700; cursor: pointer; font-size: 15px; }
        .btn-confirm-danger { background-color: var(--danger-color); color: white; }
        .btn-confirm-primary { background-color: var(--primary-color); color: white; }
        .btn-cancel { background-color: var(--border-color); color: var(--text-color); }
        .pin-input { text-align: center; font-size: 24px; letter-spacing: 5px; margin-bottom: 15px; }
        .pin-error { color: var(--danger-color); font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2>لوحة إدارة فريق العمل (مزامنة حية)</h2>
        <button class="mode-btn" onclick="toggleDarkMode()">🌙 وضع ليلي</button>
    </div>
    <div class="sync-status" id="syncStatus">جاري المزامنة...</div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 ابحث باسم المهمة، العميل، أو المسؤول...">
    </div>

    <form id="taskForm" class="form-grid">
        <div class="form-group">
            <label>اسم المهمة</label>
            <input type="text" id="taskName" placeholder="مثال: مونتاج إعلان العميل" required>
        </div>
        <div class="form-group">
            <label>المسؤول</label>
            <select id="assignee" required>
                <option value="مصطفى">مصطفى 🎬</option>
                <option value="إيمان">إيمان 🎨</option>
            </select>
        </div>
        <div class="form-group">
            <label>أضافها</label>
            <select id="createdBy" required>
                <option value="محمد">محمد</option>
                <option value="مصطفى">مصطفى</option>
                <option value="إيمان">إيمان</option>
            </select>
        </div>
        <div class="form-group">
            <label>العميل / القسم</label>
            <input type="text" id="client" placeholder="اسم العميل">
        </div>
        <div class="form-group">
            <label>موعد التسليم</label>
            <input type="date" id="deadline">
        </div>
        <button type="submit" class="add-btn">+ إضافة</button>
    </form>

    <div class="tasks-grid">
        <div class="column">
            <h3>قيد التنفيذ <span class="count-badge" id="count-progress">0</span></h3>
            <div class="column-content" id="progressColumn"></div>
        </div>
        <div class="column">
            <h3 style="color:var(--purple-color)">طلبات تعديل <span class="count-badge" id="count-revision">0</span></h3>
            <div class="column-content" id="revisionColumn"></div>
        </div>
        <div class="column">
            <h3 style="color:var(--danger-color)">مهام متأخرة <span class="count-badge" id="count-late">0</span></h3>
            <div class="column-content" id="lateColumn"></div>
        </div>
        <div class="column">
            <h3 style="color:var(--success-color)">مكتملة <span class="count-badge" id="count-done">0</span></h3>
            <div class="column-content" id="doneColumn"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="deliverModal">
    <div class="modal-content">
        <h3>🚀 تسليم العمل / ملاحظات</h3>
        <div class="form-group" style="text-align: right;">
            <label>رابط المواد (Drive)</label>
            <input type="url" id="deliverLink" placeholder="https://...">
        </div>
        <div class="form-group" style="text-align: right;">
            <label>ملاحظات / تعليقات</label>
            <textarea id="deliverNotes" rows="3" style="padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-family: 'Cairo';" placeholder="اكتب ملاحظاتك أو تعديلات العميل هنا..."></textarea>
        </div>
        <div class="modal-actions" style="margin-top: 20px;">
            <button class="modal-btn btn-cancel" onclick="closeDeliverModal()">إلغاء</button>
            <button class="modal-btn btn-confirm-primary" onclick="saveDelivery()">حفظ التسليم</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="pinModal">
    <div class="modal-content">
        <h3>🔐 صلاحية المدير</h3>
        <p>لإجراء هذا التعديل أو الحذف، يرجى إدخال رمز المدير.</p>
        <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••">
        <div class="pin-error" id="pinError">رمز غير صحيح! حاول مرة أخرى.</div>
        <div class="modal-actions" style="margin-top: 20px;">
            <button class="modal-btn btn-cancel" onclick="closePinModal()">إلغاء</button>
            <button class="modal-btn btn-confirm-primary" onclick="verifyPin()">تأكيد</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3>⚙️ تعديل بيانات المهمة</h3>
        <div class="form-group" style="text-align: right;">
            <label>اسم المهمة</label>
            <input type="text" id="editTaskName">
        </div>
        <div class="form-group" style="text-align: right;">
            <label>العميل</label>
            <input type="text" id="editClient">
        </div>
        <div class="form-group" style="text-align: right;">
            <label>موعد التسليم الجديد</label>
            <input type="date" id="editDeadline">
        </div>
        <div class="modal-actions" style="margin-top: 20px;">
            <button class="modal-btn btn-cancel" onclick="closeEditModal()">إلغاء</button>
            <button class="modal-btn btn-confirm-primary" onclick="saveEdit()">حفظ التعديلات</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-content">
        <h3 id="confirmTitle">تأكيد العملية</h3>
        <p id="confirmMessage">هل أنت متأكد؟</p>
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closeConfirm()">تراجع</button>
            <button class="modal-btn btn-confirm-danger" id="confirmBtn" onclick="executeConfirm()">تأكيد</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwRC5RigrPoFhluuZImjp3I27AlKb7KdL0jAWr98WDu2YzusR5rH3Oqvau6UUQtEo0/exec"; 
    let tasks = [];
    let editingId = null;
    let deliveringId = null; 
    let confirmCallback = null; 
    let pendingAction = null; 
    let activePin = null; 
    let searchQuery = ''; // متغير البحث

    const form = document.getElementById('taskForm');
    const searchInput = document.getElementById('searchInput');

    // استماع لكتابة البحث
    searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderTasks();
    });

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('darkModeTask', isDark);
        document.querySelector('.mode-btn').innerText = isDark ? "☀️ وضع نهاري" : "🌙 وضع ليلي";
    }
    if(localStorage.getItem('darkModeTask') === 'true') toggleDarkMode();

    function checkIfLate(deadline, status) {
        if(!deadline || status === 'مكتملة') return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        return new Date(deadline) < today;
    }

    async function fetchTasks() {
        document.getElementById('syncStatus').innerText = "جاري تحديث البيانات...";
        document.getElementById('syncStatus').style.color = "#3182ce";
        try {
            const response = await fetch(`${API_URL}?t=${Date.now()}`);
            tasks = await response.json();
            renderTasks();
            document.getElementById('syncStatus').innerText = "آخر مزامنة: " + new Date().toLocaleTimeString('ar-EG');
            document.getElementById('syncStatus').style.color = "#38a169";
        } catch (error) {
            document.getElementById('syncStatus').innerText = "خطأ في الاتصال بالخادم";
            document.getElementById('syncStatus').style.color = "#e53e3e";
        }
    }

    async function sendToSheet(data) {
        await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(data)
        });
        setTimeout(fetchTasks, 1000); 
    }

    function renderTasks() {
        document.getElementById('progressColumn').innerHTML = '';
        document.getElementById('revisionColumn').innerHTML = '';
        document.getElementById('lateColumn').innerHTML = '';
        document.getElementById('doneColumn').innerHTML = '';

        let counts = { progress: 0, revision: 0, late: 0, done: 0 };

        // فلترة المهام بناءً على البحث
        const filteredTasks = tasks.filter(task => {
            if (!searchQuery) return true; // إذا لم يكن هناك بحث، أظهر كل شيء
            return (
                task.taskName.toLowerCase().includes(searchQuery) ||
                (task.client && task.client.toLowerCase().includes(searchQuery)) ||
                task.assignee.toLowerCase().includes(searchQuery) ||
                (task.createdBy && task.createdBy.toLowerCase().includes(searchQuery))
            );
        });

        filteredTasks.forEach((task) => {
            const isLate = checkIfLate(task.deadline, task.status);
            let displayStatus = task.status;
            if(isLate && task.status !== 'مكتملة' && task.status !== 'تعديل مطلوب') {
                displayStatus = 'متأخرة'; 
            }

            const card = document.createElement('div');
            const assigneeClass = task.assignee === 'مصطفى' ? 'mustafa' : 'iman';
            card.className = `task-card ${assigneeClass} ${displayStatus === 'مكتملة' ? 'done' : ''} ${displayStatus === 'متأخرة' ? 'late' : ''}`;
            
            const formattedDate = task.deadline ? new Date(task.deadline).toLocaleDateString('ar-EG') : 'بدون موعد';
            
            let buttons = `<button class="action-btn btn-deliver" onclick="openDeliverModal('${task.id}')">📝 تسليم/ملاحظات</button>`;
            buttons += `<button class="action-btn btn-edit" onclick="requestPin(() => openEditModal('${task.id}'))">⚙️ تعديل</button>`;
            
            if (displayStatus === 'مكتملة') {
                buttons += `<button class="action-btn btn-revision" onclick="changeStatus('${task.id}', 'تعديل مطلوب')">إعادة للتعديل 🔄</button>`;
            } else {
                if(displayStatus !== 'قيد التنفيذ' && displayStatus !== 'متأخرة') {
                    buttons += `<button class="action-btn btn-progress" onclick="changeStatus('${task.id}', 'قيد التنفيذ')">استئناف ▶️</button>`;
                }
                if(displayStatus !== 'تعديل مطلوب') {
                    buttons += `<button class="action-btn btn-revision" onclick="changeStatus('${task.id}', 'تعديل مطلوب')">طلب تعديل ✍️</button>`;
                }
                buttons += `<button class="action-btn btn-complete" onclick="changeStatus('${task.id}', 'مكتملة')">إنهاء ✅</button>`;
            }
            buttons += `<button class="action-btn del-btn" onclick="requestPin(() => deleteTask('${task.id}'))">🗑️</button>`;

            card.innerHTML = `
                <div class="task-title">${task.taskName}</div>
                <div class="task-meta">
                    <span class="assignee-tag ${assigneeClass === 'mustafa' ? 'tag-mustafa' : 'tag-iman'}">المسؤول: ${task.assignee}</span>
                    <span class="creator-tag">أضافها: ${task.createdBy || '-'}</span>
                </div>
                <div class="task-meta">
                    <span>👤 ${task.client || 'عميل غير محدد'}</span>
                    <span>📅 التسليم: ${formattedDate}</span>
                </div>
                ${task.link ? `<div class="task-meta"><a href="${task.link}" target="_blank" style="color:var(--primary-color); text-decoration:none; font-weight:bold;">🔗 فتح رابط المواد</a></div>` : ''}
                ${task.notes ? `<div class="task-notes">📝 ${task.notes}</div>` : ''}
                <div class="task-actions">${buttons}</div>
            `;

            if(displayStatus === 'مكتملة') {
                document.getElementById('doneColumn').appendChild(card);
                counts.done++;
            } else if(displayStatus === 'تعديل مطلوب') {
                document.getElementById('revisionColumn').appendChild(card);
                counts.revision++;
            } else if(displayStatus === 'متأخرة') {
                document.getElementById('lateColumn').appendChild(card);
                counts.late++;
            } else {
                document.getElementById('progressColumn').appendChild(card);
                counts.progress++;
            }
        });

        // تحديث العداد ليعكس العدد الإجمالي (وليس المفلتر فقط)
        document.getElementById('count-progress').innerText = counts.progress;
        document.getElementById('count-revision').innerText = counts.revision;
        document.getElementById('count-late').innerText = counts.late;
        document.getElementById('count-done').innerText = counts.done;
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const newTask = {
            taskName: document.getElementById('taskName').value,
            assignee: document.getElementById('assignee').value,
            createdBy: document.getElementById('createdBy').value,
            client: document.getElementById('client').value,
            deadline: document.getElementById('deadline').value,
            link: "", 
            notes: "", 
            status: 'قيد التنفيذ'
        };
        sendToSheet(newTask);
        form.reset();
    });

    function changeStatus(id, newStatus) {
        const task = tasks.find(t => t.id === id);
        if(task) {
            task.status = newStatus;
            sendToSheet(task);
        }
    }

    function requestPin(actionCallback) {
        pendingAction = actionCallback;
        document.getElementById('pinInput').value = '';
        document.getElementById('pinError').style.display = 'none';
        document.getElementById('pinModal').style.display = 'flex';
    }

    async function verifyPin() {
        const enteredPin = document.getElementById('pinInput').value;
        document.getElementById('pinError').style.display = 'none';
        document.getElementById('pinError').innerText = "جاري التحقق...";
        document.getElementById('pinError').style.color = "#3182ce";
        document.getElementById('pinError').style.display = 'block';

        try {
            const response = await fetch(`${API_URL}?action=verifyPin&pin=${enteredPin}&t=${Date.now()}`);
            const result = await response.json();
            if (result.verified) {
                activePin = enteredPin;
                const actionToRun = pendingAction; 
                closePinModal(); 
                if (actionToRun) actionToRun(); 
            } else {
                document.getElementById('pinError').innerText = "رمز غير صحيح! حاول مرة أخرى.";
                document.getElementById('pinError').style.color = "#e53e3e";
                document.getElementById('pinError').style.display = 'block';
            }
        } catch (err) {
            document.getElementById('pinError').innerText = "خطأ في الاتصال بالخادم.";
            document.getElementById('pinError').style.color = "#e53e3e";
            document.getElementById('pinError').style.display = 'block';
        }
    }

    function closePinModal() {
        document.getElementById('pinModal').style.display = 'none';
        pendingAction = null;
    }

    function openDeliverModal(id) {
        deliveringId = id;
        const task = tasks.find(t => t.id === id);
        if(task) {
            document.getElementById('deliverLink').value = task.link || '';
            document.getElementById('deliverNotes').value = task.notes || '';
            document.getElementById('deliverModal').style.display = 'flex';
        }
    }
    function closeDeliverModal() {
        document.getElementById('deliverModal').style.display = 'none';
        deliveringId = null;
    }
    function saveDelivery() {
        if(deliveringId) {
            const task = tasks.find(t => t.id === deliveringId);
            if(task) {
                task.link = document.getElementById('deliverLink').value;
                task.notes = document.getElementById('deliverNotes').value;
                sendToSheet(task);
                closeDeliverModal();
            }
        }
    }

    function openEditModal(id) {
        editingId = id;
        const task = tasks.find(t => t.id === id);
        if(task) {
            document.getElementById('editTaskName').value = task.taskName;
            document.getElementById('editClient').value = task.client || '';
            document.getElementById('editDeadline').value = task.deadline || '';
            document.getElementById('editModal').style.display = 'flex';
        }
    }
    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
        editingId = null;
        activePin = null; 
    }
    function saveEdit() {
        if(editingId) {
            const task = tasks.find(t => t.id === editingId);
            if(task) {
                showConfirm("هل أنت متأكد من حفظ التعديلات؟", () => {
                    task.taskName = document.getElementById('editTaskName').value;
                    task.client = document.getElementById('editClient').value;
                    task.deadline = document.getElementById('editDeadline').value;
                    if(task.status === 'متأخرة') task.status = 'قيد التنفيذ';
                    task.action = 'updateData'; 
                    task.pin = activePin; 
                    sendToSheet(task);
                    closeEditModal();
                }, "نعم، احفظ", "btn-confirm-primary");
            }
        }
    }

    function deleteTask(id) {
        showConfirm("⚠️ تحذير: سيتم حذف هذه المهمة نهائياً. هل أنت متأكد؟", () => {
            sendToSheet({ action: 'delete', id: id, pin: activePin }); 
            activePin = null; 
        }, "نعم، احذف", "btn-confirm-danger");
    }

    function showConfirm(message, callback, btnText = "تأكيد", btnClass = "btn-confirm-danger") {
        document.getElementById('confirmMessage').innerText = message;
        const confirmBtn = document.getElementById('confirmBtn');
        confirmBtn.innerText = btnText;
        confirmBtn.className = `modal-btn ${btnClass}`;
        confirmCallback = callback;
        document.getElementById('confirmModal').style.display = 'flex';
    }
    function closeConfirm() {
        document.getElementById('confirmModal').style.display = 'none';
        confirmCallback = null;
    }
    function executeConfirm() {
        if(confirmCallback) confirmCallback();
        closeConfirm();
    }

    fetchTasks();
    setInterval(fetchTasks, 15000); 
</script>

</body>
</html>
